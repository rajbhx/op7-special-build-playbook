name: Playbook Sync

# Auto-updates the playbook from every registered project's field-notes log.
# Reads projects/*/manifest.yml, fetches each log (public repos, GITHUB_TOKEN
# is enough), regenerates projects/<slug>/README.md + projects/README.md.
# Weekly + manual + repository_dispatch (type: field-notes-sync).

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
  repository_dispatch:
    types: [field-notes-sync]

permissions:
  contents: write

jobs:
  sync:
    name: Fetch logs and regenerate project docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch field-notes logs for all projects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _logs
          FOUND=0
          for MANIFEST in projects/*/manifest.yml; do
            SLUG="$(basename "$(dirname "$MANIFEST")")"
            [ "$SLUG" = "_template" ] && continue
            REPO="$(grep -A1 '^  field_notes:' "$MANIFEST" | sed -n 's/^    repo: *//p' | head -1)"
            PATH_FIELD="$(grep -A2 '^  field_notes:' "$MANIFEST" | sed -n 's/^    path: *//p' | head -1)"
            if [ -n "$REPO" ] && [ -n "$PATH_FIELD" ]; then
              if gh api "repos/$REPO/contents/$PATH_FIELD" -H "Accept: application/vnd.github.raw" > "_logs/$SLUG.yml" 2>/dev/null; then
                echo "fetched $SLUG <- $REPO:$PATH_FIELD ($(wc -l < "_logs/$SLUG.yml") lines)"
                FOUND=$((FOUND+1))
              else
                echo "::warning::could not fetch log for $SLUG ($REPO:$PATH_FIELD)"
              fi
            fi
          done
          echo "logs fetched: $FOUND"

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Generate project docs
        run: python3 scripts/generate_project_docs.py _logs

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "no changes; nothing to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add projects/
            git commit -m "chore(playbook): auto-sync project docs from field-notes logs"
            git push
            echo "pushed updated project docs"
          fi

      - name: Write summary
        if: always()
        run: |
          {
            echo "## Playbook sync"
            echo "- fetched logs for all projects registered in \`projects/*/manifest.yml\`"
            echo "- regenerated \`projects/<slug>/README.md\` + \`projects/README.md\`"
            echo "- triggers: weekly + manual + \`repository_dispatch\` type \`field-notes-sync\`"
          } >> "$GITHUB_STEP_SUMMARY"
